name: Personal build

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      build_only:
        description: "Test the current fork without syncing or releasing"
        type: boolean
        default: false

permissions: {}
concurrency:
  group: personal-build
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      base: ${{ steps.candidate.outputs.base }}
      needed: ${{ steps.candidate.outputs.needed }}
      pr: ${{ steps.pr.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare candidate merge
        id: candidate
        shell: bash
        env:
          BUILD_ONLY: ${{ inputs.build_only }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "needed=false" >> "$GITHUB_OUTPUT"
          if [ "$BUILD_ONLY" != "true" ]; then
            if [ -z "$SYNC_TOKEN" ]; then
              echo "Add the SYNC_TOKEN repository secret before syncing."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898747+github-actions[bot]@users.noreply.github.com"
            git remote add upstream https://github.com/oipoistar/tinta.git
            git fetch upstream master
            if ! git merge-base --is-ancestor upstream/master HEAD; then
              git switch -c "sync-upstream-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              git merge --no-ff --no-edit upstream/master
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "branch=$(git branch --show-current)" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push candidate and open pull request
        if: steps.candidate.outputs.needed == 'true'
        id: pr
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SYNC_BRANCH: ${{ steps.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$SYNC_BRANCH"
          pr=$(gh pr create --base master --head "$SYNC_BRANCH" \
            --title "Sync upstream master" \
            --body "Sync upstream into this fork after the Release build and tests pass.")
          echo "url=$pr" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tree: ${{ steps.source.outputs.tree }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Record source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          version=$(sed -n 's/^project(tinta VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        env:
          CFLAGS: /MP
          CXXFLAGS: /MP
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.build_only }}
        with:
          name: personal-executable
          path: build/Release/tinta.exe
          if-no-files-found: error

  merge-and-release:
    if: ${{ !inputs.build_only }}
    needs: [prepare, build]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # This fresh runner never executes the candidate's code.
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Merge tested pull request
        if: needs.prepare.outputs.needed == 'true'
        shell: bash
        env:
          EXPECTED_BASE: ${{ needs.prepare.outputs.base }}
          EXPECTED_HEAD: ${{ needs.prepare.outputs.commit }}
          PR_URL: ${{ needs.prepare.outputs.pr }}
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin master
          if [ "$(git rev-parse origin/master)" != "$EXPECTED_BASE" ]; then
            echo "Fork master changed during testing; leaving the pull request for review."
            exit 1
          fi
          gh pr merge "$PR_URL" --merge --match-head-commit "$EXPECTED_HEAD" --delete-branch

      - name: Verify merged source matches the tested tree
        id: source
        shell: bash
        env:
          EXPECTED_TREE: ${{ needs.build.outputs.tree }}
        run: |
          set -euo pipefail
          git fetch origin master --tags
          commit=$(git rev-parse origin/master)
          if [ "$(git rev-parse "$commit^{tree}")" != "$EXPECTED_TREE" ]; then
            echo "The merged source differs from the tested source; refusing to release."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: personal-executable
          path: release
      - name: Publish personal release if due
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          tag="v${VERSION}-personal"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to do."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists without a release; refusing to reuse it."
            exit 1
          fi
          gh release create "$tag" release/tinta.exe --target "$COMMIT" \
            --title "Tinta $VERSION (personal)" \
            --notes "Built from this fork at $COMMIT. Run tinta.exe and answer Yes to install it into Program Files."
