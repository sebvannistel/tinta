# Update this fork weekly, test the combined code, and publish personal releases.
name: Personal build

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      build_only:
        description: "Test the current fork without syncing or releasing"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: personal-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Check sync credentials
        if: ${{ !inputs.build_only }}
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "Add a SYNC_TOKEN Actions secret with Contents, Workflows and Pull requests write permissions before syncing."
            exit 1
          fi

      - name: Prepare upstream merge
        if: ${{ !inputs.build_only }}
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898747+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/oipoistar/tinta.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            git switch -c "sync-upstream-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git merge --no-ff --no-edit upstream/master
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "branch=$(git branch --show-current)" >> "$GITHUB_OUTPUT"
            echo "base=$(git rev-parse origin/master)" >> "$GITHUB_OUTPUT"
          fi

      # Push before building so permission errors fail without wasting a build.
      - name: Open sync pull request
        if: steps.sync.outputs.needed == 'true'
        id: pr
        shell: bash
        env:
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$SYNC_BRANCH"
          pr=$(gh pr create --base master --head "$SYNC_BRANCH" \
            --title "Sync upstream master" \
            --body "Automatically merge upstream into this fork after the Release build and tests pass.")
          echo "url=$pr" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        env:
          CFLAGS: /MP
          CXXFLAGS: /MP

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Merge tested sync pull request
        if: steps.sync.outputs.needed == 'true'
        shell: bash
        env:
          EXPECTED_BASE: ${{ steps.sync.outputs.base }}
          PR_URL: ${{ steps.pr.outputs.url }}
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin master
          if [ "$(git rev-parse origin/master)" != "$EXPECTED_BASE" ]; then
            echo "Fork master changed during testing; leaving the pull request for review."
            exit 1
          fi
          gh pr merge "$PR_URL" --merge --match-head-commit "$(git rev-parse HEAD)" --delete-branch

      # Check out the actual merged commit and rebuild it, so the release tag
      # identifies exactly the source used to produce the executable.
      - name: Checkout merged master
        if: steps.sync.outputs.needed == 'true'
        shell: bash
        run: |
          git fetch origin master
          git checkout --detach origin/master
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
        env:
          CFLAGS: /MP
          CXXFLAGS: /MP

      - name: Decide whether a release is due
        if: ${{ !inputs.build_only }}
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(tinta VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          tag="v${version}-personal"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; nothing to do."
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.version.outputs.due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          commit=$(git rev-parse HEAD)
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists without a release; refusing to attach a build to an old commit."
            exit 1
          fi
          gh release create "$tag" build/Release/tinta.exe \
            --target "$commit" \
            --title "Tinta ${{ steps.version.outputs.version }} (personal)" \
            --notes "Built from this fork's master at $commit. Run tinta.exe and answer Yes to install it into Program Files."
