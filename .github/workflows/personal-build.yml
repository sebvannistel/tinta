# Personal build: once a week (Mondays), replay this fork's own commits on
# top of the owner's latest code (in the runner only, nothing is pushed),
# build and test it, and publish tinta.exe as a release whenever the owner's
# version number moves on. A conflict or a failing test publishes nothing;
# GitHub emails the failed run. The installed Tinta updates itself from
# these releases.
name: Personal build

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build and test even if this version is released, without releasing"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    # gh would otherwise pick the "upstream" remote added below and aim
    # its release calls at the owner's repository
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      # Scheduled runs pause after 60 days without repository activity;
      # re-enabling the workflow resets that clock
      - name: Keep the schedule alive
        shell: bash
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/personal-build.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}

      # A rebase, not a merge: it skips commits whose changes the owner
      # already has, such as copies of merged pull requests, which a merge
      # would set against the owner's later edits to the same lines
      - name: Put this fork's commits on the owner's latest code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898747+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/oipoistar/tinta.git
          git fetch upstream master
          git rebase upstream/master

      - name: Decide whether a release is due
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^project(tinta VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          tag="v${version}-personal"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.build_only }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Build only; nothing will be released."
          elif gh release view "$tag" > /dev/null 2>&1; then
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; nothing to do."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # /MP compiles a target's files on all the runner's cores, and
      # --parallel builds the targets side by side: one file at a time, the
      # build took 36 minutes
      - name: Configure
        if: steps.version.outputs.build == 'true'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        env:
          CFLAGS: /MP
          CXXFLAGS: /MP

      - name: Build
        if: steps.version.outputs.build == 'true'
        run: cmake --build build --config Release --parallel

      - name: Test
        if: steps.version.outputs.build == 'true'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Release
        if: steps.version.outputs.due == 'true'
        shell: bash
        run: |
          upstream=$(git rev-parse --short upstream/master)
          gh release create "${{ steps.version.outputs.tag }}" build/Release/tinta.exe \
            --target "${{ github.sha }}" \
            --title "Tinta ${{ steps.version.outputs.version }} (personal)" \
            --notes "Tinta ${{ steps.version.outputs.version }} with the personal changes from this fork's master, merged with the owner's code at ${upstream}. Run tinta.exe and answer Yes to install it into Program Files."
        env:
          GH_TOKEN: ${{ github.token }}
